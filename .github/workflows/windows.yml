name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify
      - run: npm run package
      - run: npm run installer
      - name: Verify actual update downloads and checksum rejection
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json | ConvertFrom-Json).version
          node test/update-feed.cjs "release/Larp-Browser-Setup-$releaseVersion.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Update feed checks failed' }
      - name: Check packaged startup
        shell: pwsh
        run: |
          $appProcess = Start-Process -FilePath '.\dist\PowerShell Browser-win32-x64\PowerShell Browser.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($appProcess.ExitCode -ne 0) { throw 'Packaged startup failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: PowerShell-Browser-Windows
          path: dist/PowerShell Browser-win32-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: Larp-Browser-Installer-and-Update-Feed
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
      - name: Publish installer and update metadata on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseData = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
            $releaseData = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets,isDraft | ConvertFrom-Json
          }
          $existingNames = @($releaseData.assets | ForEach-Object { $_.name })
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } | ForEach-Object {
            if ($_.Name -notin $existingNames) {
              gh release upload $env:GITHUB_REF_NAME $_.FullName --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
            }
          }
          if ($releaseData.isDraft) { gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: verification/
